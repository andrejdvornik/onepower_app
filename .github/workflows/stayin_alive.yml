name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit App
        run: |
          curl --fail \
               --silent \
               --show-error \
               --retry 3 \
               --retry-delay 10 \
               --max-time 60 \
               "https://onepower.streamlit.app"
